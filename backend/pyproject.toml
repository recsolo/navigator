[project]
name = "navagator-backend"
version = "0.2.0"
description = "Local-first backend for the Navagator AI guidance engine"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116.0,<1.0.0",
  "keyring>=25.6.0,<26.0.0",
  "openai>=1.108.0,<2.0.0",
  "uvicorn[standard]>=0.35.0,<1.0.0",
  "pydantic>=2.11.0,<3.0.0"
]

[project.optional-dependencies]
build = [
  "pyinstaller>=6.15.0,<7.0.0"
]
dev = [
  "httpx>=0.28.0,<1.0.0",
  "pytest>=8.0.0,<9.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
